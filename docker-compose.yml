name: huld-support-bot

services:
  support-bot:
    build: .
    env_file: .env
    environment:
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  valkey:
    image: valkey/valkey:8.1.10-alpine
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  valkey-data:
